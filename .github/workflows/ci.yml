name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check; defaults to the triggering commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --release
        if: matrix.toolchain == 'stable'
      - run: cargo run --locked --example header
      - run: cargo run --locked --example elf
      - run: cargo run --locked --example protocol
      - run: cargo package --locked

  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --locked --target i686-unknown-linux-gnu
      - run: cargo test --locked --target i686-unknown-linux-gnu --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
